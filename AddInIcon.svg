<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Main ferrule body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A2A7B0"/>
      <stop offset="30%" stop-color="#E2E6EC"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B8BDC7"/>
    </linearGradient>

    <!-- Top interior / blue highlight gradient -->
    <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3584D4"/>
      <stop offset="50%" stop-color="#55B2F8"/>
      <stop offset="100%" stop-color="#2D72C0"/>
    </linearGradient>

    <!-- Inner lip shadow gradient -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60656E"/>
      <stop offset="100%" stop-color="#B0B5BF"/>
    </linearGradient>
  </defs>

  <g stroke="#2D3238" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- MAIN OUTER FERRULE BODY (DT 5-2 PROFILE) -->
    <!-- Lower cylinder -> conical transition -> middle ring -> upper shoulder -> top neck -->
    <path d="
      M 32,106
      L 32,68
      C 32,68 36,54 44,48
      L 44,38
      C 44,38 48,34 50,33
      L 50,22
      C 50,19 78,19 78,22
      L 78,33
      C 80,34 84,38 84,38
      L 84,48
      C 92,54 96,68 96,68
      L 96,106
      Z" 
      fill="url(#bodyGrad)" />

    <!-- BASE ELLIPSE (BOTTOM LIP) -->
    <path d="M 32,106 C 32,114 96,114 96,106 C 96,98 32,98 32,106 Z" fill="#9DA2AD" />
    <path d="M 38,106 C 38,111 90,111 90,106 C 90,101 38,101 38,106 Z" fill="url(#innerShadow)" />

    <!-- RIDGE / TRANSITION SEAM LINES -->
    <!-- Lower transition seam -->
    <path d="M 32,68 C 32,74 96,74 96,68" fill="none" stroke-width="2.5" />
    
    <!-- Middle band seam -->
    <path d="M 44,48 C 44,53 84,53 84,48" fill="none" stroke-width="2.5" />
    <path d="M 44,38 C 44,43 84,43 84,38" fill="none" stroke-width="2" />

    <!-- Upper neck seam -->
    <path d="M 50,33 C 50,37 78,37 78,33" fill="none" stroke-width="2" />

    <!-- TOP OPENING / BLUE FEATURE HIGHLIGHT (FUSION 360 ICON STYLE) -->
    <ellipse cx="64" cy="22" rx="14" ry="5" fill="url(#blueHighlight)" />

    <!-- PLUS ACTION SYMBOL (Fusion "Add / Create" Add-in Badge) -->
    <g transform="translate(76, 78)">
      <circle cx="14" cy="14" r="14" fill="#2BB153" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M 14,7 L 14,21 M 7,14 L 21,14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>

  </g>
</svg>
